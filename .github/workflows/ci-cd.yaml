name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: fastapi-otel

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and push multi-arch image
      run: |
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -f docker/Dockerfile \
          --push .

    - name: Update deployment.yaml
      run: |
        sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml

    - name: Commit manifest change
      env:
        PUSH_TOKEN: ${{ secrets.GA_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/deployment.yaml
        if git diff --cached --quiet; then
          echo "No manifest updates to commit"
          exit 0
        fi
        git commit -m "Update image tag to ${{ github.sha }}"
        git push https://${PUSH_TOKEN}@github.com/${{ github.repository }} HEAD:main