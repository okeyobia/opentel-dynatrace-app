apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
      prometheus:
        config:
          scrape_configs:
            - job_name: fastapi-otel
              metrics_path: /metrics
              static_configs:
                - targets: ["fastapi-service:80"]

    exporters:
      otlphttp/dynatrace:
        endpoint: "${tenantUrl}"
        headers:
          Authorization: "Api-Token ${API_TOKEN}"

    processors:
      batch:

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/dynatrace]
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [otlphttp/dynatrace]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/dynatrace]