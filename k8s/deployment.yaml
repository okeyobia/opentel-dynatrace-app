apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-otel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-otel
  template:
    metadata:
      labels:
        app: fastapi-otel
    spec:
      containers:
        - name: fastapi
          image: okeyobia/fastapi-otel:7cbe8aeb1dae56d2ae838554b460c71f1e122538
          ports:
            - containerPort: 8000
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318